<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cabine · Fiche pièce</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E1F2B}a:hover{color:#4F141E}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#6B5D52}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EBDD; color: #2A211C; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column">

<header style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: 12px 8px 0">
<a href="Catalogue.dc.html" aria-label="Retour au catalogue" style="width: 44px; height: 44px; border-radius: 22px; color: #2A211C; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.28em; color: #6E1F2B; padding-left: 0.28em">FICHE PIÈCE</span>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52; margin-top: 2px">Maille · MAI-01</span>
</div>
<span></span>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #FBF6EC; border: 1px solid #DDD0BA; border-radius: 16px">
<span style="width: 56px; height: 56px; border-radius: 28px; flex-shrink: 0; border: 1px solid #6B5D52; background: {{hex}}"></span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 20px; line-height: 1.15">Pull torsadé bordeaux</span>
<span style="font-size: 12.5px; color: #6B5D52">Maille · Pull col rond · {{hexName}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-nom" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Nom</label>
<input id="f-nom" type="text" value="Pull torsadé bordeaux" style="height: 48px; padding: 0 14px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; color: #2A211C; box-sizing: border-box">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-empl" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Emplacement</label>
<div style="position: relative">
<select id="f-empl" style="width: 100%; height: 48px; padding: 0 36px 0 14px; appearance: none; -webkit-appearance: none; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; color: #2A211C">
<option>Haut</option><option selected>Maille</option><option>Veste</option><option>Manteau</option><option>Pantalon</option><option>Chaussures</option><option>Écharpe</option><option>Ceinture</option><option>Cravate</option><option>Montre</option><option>Lunettes</option><option>Chaussettes</option>
</select>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-forme" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Forme</label>
<div style="position: relative">
<select id="f-forme" style="width: 100%; height: 48px; padding: 0 36px 0 14px; appearance: none; -webkit-appearance: none; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; color: #2A211C">
<option selected>Pull col rond</option><option>Pull col V</option><option>Gilet boutonné</option><option>Quarter-zip</option>
</select>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Teinte · <span style="color: #2A211C; letter-spacing: 0.06em">{{hexName}}</span></legend>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; justify-items: center">
<sc-for list="{{tints}}" as="t" hint-placeholder-count="14">
<button onClick="{{t.pick}}" aria-label="{{t.name}}" aria-pressed="{{t.on}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 32px; height: 32px; border-radius: 16px; background: {{t.hex}}; border: 1px solid #6B5D52; box-shadow: {{t.ring}}"></span>
</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-mat" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Matière</label>
<input id="f-mat" type="text" value="Laine, coudières en daim" style="height: 48px; padding: 0 14px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; color: #2A211C; box-sizing: border-box">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-tag" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Tags</label>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px">
<sc-for list="{{tags}}" as="tg" hint-placeholder-count="3">
<button onClick="{{tg.remove}}" aria-label="Retirer le tag {{tg.label}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border: 0; border-radius: 16px; background: #EADFCB; color: #2A211C; font-family: 'Figtree', sans-serif; font-size: 13px; font-weight: 500">{{tg.label}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-for>
<input id="f-tag" type="text" placeholder="Ajouter un tag" style="flex: 1; min-width: 110px; height: 32px; border: 0; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; color: #2A211C; outline: none">
</div>
<sc-if value="{{hasSugg}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12.5px; font-style: italic; color: #6B5D52; margin-right: 2px">Suggestions</span>
<sc-for list="{{sugg}}" as="sg" hint-placeholder-count="4">
<button onClick="{{sg.add}}" aria-label="Ajouter le tag {{sg.label}}" style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border: 1px dashed #A8977C; border-radius: 16px; background: transparent; color: #2A211C; font-family: 'Figtree', sans-serif; font-size: 13px">
<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6E1F2B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{sg.label}}</button>
</sc-for>
</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-notes" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Notes</label>
<textarea id="f-notes" rows="3" style="padding: 12px 14px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; line-height: 1.45; color: #2A211C; resize: none">Ne se porte jamais rentré. Lavage main à froid.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-code" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5D52">Code</label>
<input id="f-code" type="text" value="MAI-01" style="height: 48px; padding: 0 14px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: #2A211C; box-sizing: border-box">
<span style="font-size: 12px; color: #6B5D52">Proposé d'après l'emplacement, modifiable. Doit rester unique.</span>
</div>
</div>

<div style="padding: 10px 16px 20px; border-top: 1px solid #DDD0BA; display: flex; gap: 10px">
<button style="height: 52px; padding: 0 18px; border: 1px solid #CDBEA5; border-radius: 12px; background: transparent; color: #6E1F2B; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600">Supprimer</button>
<a href="Catalogue.dc.html" style="flex: 1; height: 52px; border-radius: 12px; background: #6E1F2B; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Enregistrer</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tint: 'Bordeaux', tags: ['laine', 'hiver', 'coudières'] };
  renderVals() {
    const T = [['Écru', '#E9DFC7'], ['Camel', '#B5884F'], ['Moutarde', '#C29A3A'], ['Terracotta', '#C0704F'], ['Rouille', '#A4532B'], ['Bordeaux', '#6E2230'], ['Marron', '#6B4A33'], ['Sauge', '#9AA58A'], ['Olive', '#6F6B3A'], ['Vert forêt', '#2F4A3A'], ['Bleu pétrole', '#2E5560'], ['Marine', '#26324A'], ['Gris flanelle', '#8A8780'], ['Anthracite', '#3A3A3C']];
    const s = this.state;
    const cur = T.find((t) => t[0] === s.tint);
    const pool = ['automne', 'preppy', 'bureau', 'week-end', 'torsadé', 'hiver', 'laine'];
    const sugg = pool.filter((p) => s.tags.indexOf(p) < 0).slice(0, 4);
    return {
      hex: cur[1], hexName: cur[0],
      tints: T.map((t) => ({ name: t[0], hex: t[1], on: t[0] === s.tint, ring: t[0] === s.tint ? '0 0 0 2px #F3EBDD, 0 0 0 4px #6E1F2B' : 'none', pick: () => this.setState({ tint: t[0] }) })),
      tags: s.tags.map((t) => ({ label: t, remove: () => this.setState({ tags: this.state.tags.filter((x) => x !== t) }) })),
      sugg: sugg.map((t) => ({ label: t, add: () => this.setState({ tags: this.state.tags.concat([t]) }) })),
      hasSugg: sugg.length > 0
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cabine · Catalogue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E1F2B}a:hover{color:#4F141E}
button{cursor:pointer}
input::placeholder{color:#6B5D52}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EBDD; color: #2A211C; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column">

<header style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: 12px 8px 0">
<a href="D-mobile.dc.html" aria-label="Retour à la composition" style="width: 44px; height: 44px; border-radius: 22px; color: #2A211C; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.28em; color: #6E1F2B; padding-left: 0.28em">CATALOGUE</span>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52; margin-top: 2px">{{total}} pièces · 12 emplacements</span>
</div>
<a href="Fiche-piece.dc.html" aria-label="Ajouter une pièce" style="width: 44px; height: 44px; border-radius: 22px; background: #6E1F2B; color: #FBF6EC; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</header>

<div style="padding: 12px 16px 6px">
<label for="cat-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher une pièce</label>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #FBF6EC; border: 1px solid #CDBEA5; border-radius: 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
<input id="cat-search" type="search" placeholder="Nom, code, matière…" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: 'Figtree', sans-serif; font-size: 15px; color: #2A211C; outline: none">
</div>
</div>

<nav aria-label="Aller à un emplacement" style="display: flex; gap: 6px; padding: 4px 16px 8px; overflow-x: auto">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<a href="#{{g.id}}" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #DDD0BA; border-radius: 17px; background: transparent; color: #2A211C; font-size: 12.5px; font-weight: 500; white-space: nowrap; text-decoration: none; flex-shrink: 0">{{g.label}} <span style="color: #6B5D52">{{g.count}}</span></a>
</sc-for>
</nav>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section id="{{g.id}}" style="padding-top: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px">
<h2 style="margin: 0; font-family: 'Libre Caslon Text', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6E1F2B">{{g.label}}</h2>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52">{{g.count}} pièces</span>
</div>
<div style="background: #FBF6EC; border: 1px solid #DDD0BA; border-radius: 14px; overflow: hidden">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="Fiche-piece.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 10px 8px 14px; border-top: 1px solid {{it.rule}}; color: #2A211C; text-decoration: none">
<span style="width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; border: 1px solid #6B5D52; background: {{it.color}}"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<span style="font-size: 12px; color: #6B5D52">{{it.code}} · {{it.mat}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>

<div style="padding: 10px 16px 20px; border-top: 1px solid #DDD0BA; display: flex; gap: 10px">
<a href="Import-CSV.dc.html" style="flex: 1; height: 48px; border: 1px solid #CDBEA5; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #2A211C; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"></path></svg>
Importer un CSV
</a>
<a href="Filtres.dc.html" style="flex: 1; height: 48px; border: 1px solid #CDBEA5; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #2A211C; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
Filtres
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const H = { ecru: '#E9DFC7', camel: '#B5884F', marron: '#6B4A33', rouille: '#A4532B', terracotta: '#C0704F', bordeaux: '#6E2230', moutarde: '#C29A3A', olive: '#6F6B3A', sauge: '#9AA58A', foret: '#2F4A3A', petrole: '#2E5560', marine: '#26324A', flanelle: '#8A8780', anthracite: '#3A3A3C' };
    const raw = [
      ['manteau', 'Manteau', [['Duffle-coat doublé tartan', 'MAN-01', H.camel, 'Laine bouillie'], ['Parka kaki', 'MAN-02', H.olive, 'Coton ciré'], ['Pardessus marine', 'MAN-03', H.marine, 'Laine et cachemire']]],
      ['veste', 'Veste', [['Blouson daim marron', 'VES-01', H.marron, 'Daim, col velours'], ['Blazer velours camel', 'VES-02', H.camel, 'Velours côtelé'], ['Blazer tweed olive', 'VES-03', H.olive, 'Tweed']]],
      ['maille', 'Maille', [['Pull torsadé bordeaux', 'MAI-01', H.bordeaux, 'Laine, coudières daim'], ['Gilet Prince de Galles', 'MAI-02', H.camel, 'Laine'], ['Quarter-zip côtelé', 'MAI-03', H.petrole, 'Coton côtelé'], ['Col V laine sauge', 'MAI-04', H.sauge, 'Laine mérinos']]],
      ['haut', 'Haut', [['Chemise Oxford écru', 'HAU-01', H.ecru, 'Coton Oxford'], ['Chemise Prince de Galles', 'HAU-02', H.flanelle, 'Coton'], ['Chemise flanelle terracotta', 'HAU-03', H.terracotta, 'Flanelle de coton']]],
      ['pantalon', 'Pantalon', [['Double pli marine', 'PAN-01', H.marine, 'Laine froide'], ['Rayure craie marron', 'PAN-02', H.marron, 'Laine'], ['Flanelle grise', 'PAN-03', H.flanelle, 'Flanelle de laine'], ['Velours côtelé olive', 'PAN-04', H.olive, 'Velours côtelé']]],
      ['chaussures', 'Chaussures', [['Derby marron bout rond', 'CHA-01', H.marron, 'Cuir lisse'], ['Chukka daim rouille', 'CHA-02', H.rouille, 'Daim'], ['Derby anthracite', 'CHA-03', H.anthracite, 'Cuir grainé']]],
      ['accessoires', 'Accessoires', [['Écharpe vert forêt', 'ECH-01', H.foret, 'Laine d’agneau'], ['Ceinture cuir marron', 'CEI-01', H.marron, 'Cuir'], ['Cravate tricot bordeaux', 'CRA-01', H.bordeaux, 'Soie tricotée'], ['Montre bracelet camel', 'MON-01', H.camel, 'Bracelet cuir'], ['Monture écaille', 'LUN-01', H.marron, 'Acétate'], ['Chaussettes moutarde', 'CHT-02', H.moutarde, 'Coton']]]
    ];
    let total = 0;
    const groups = raw.map((g) => {
      total += g[2].length;
      return { id: g[0], label: g[1], count: g[2].length, items: g[2].map((it, i) => ({ name: it[0], code: it[1], color: it[2], mat: it[3], rule: i === 0 ? 'transparent' : '#E6DBC6' })) };
    });
    return { groups: groups, total: total };
  }
}
</script>
</body>
</html>

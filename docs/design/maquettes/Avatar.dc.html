<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Avatar Cabine</title>
<script src="./support.js"></script>
</head>
<body>

<svg viewBox="0 0 200 460" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{alt}}">
<g stroke="{{line}}" stroke-width="{{sw}}" stroke-linejoin="round" stroke-linecap="round">
<path d="M44 96 Q33 104 31 124 L24 210 L40 212 L50 140 Z" fill="{{skin}}"></path>
<path d="M156 96 Q167 104 169 124 L176 210 L160 212 L150 140 Z" fill="{{skin}}"></path>

<ellipse cx="168" cy="222" rx="8" ry="12" fill="{{skin}}"></ellipse>
<rect x="91" y="52" width="18" height="34" fill="{{skin}}"></rect>
<ellipse cx="100" cy="36" rx="18" ry="23" fill="{{skin}}"></ellipse>
<path d="M66 404 L92 404 L92 418 L66 418 Z M108 404 L134 404 L134 418 L108 418 Z" fill="{{socks}}" display="{{d.socks}}"></path>
<path d="M60 404 L92 404 L92 416 L60 416 Z M108 404 L140 404 L140 416 L108 416 Z" fill="{{skin}}" display="{{d.noSocks}}"></path>
<path d="M54 210 L146 210 L150 300 L140 406 L108 406 L101 266 L99 266 L92 406 L60 406 L50 300 Z" fill="{{pants}}" display="{{d.pants}}"></path>
<path d="M58 414 L92 414 Q96 414 96 420 L96 428 Q96 432 92 432 L50 432 Q44 432 46 426 Q48 418 58 414 Z M142 414 L108 414 Q104 414 104 420 L104 428 Q104 432 108 432 L150 432 Q156 432 154 426 Q152 418 142 414 Z" fill="{{shoes}}" display="{{d.shoes}}"></path>
<g display="{{d.top}}">
<path d="M58 84 Q100 74 142 84 L156 94 Q161 122 152 152 L148 216 L52 216 L48 152 Q39 122 44 94 Z" fill="{{top}}"></path>
<path d="{{p.sleeveL}}" fill="{{top}}"></path>
<path d="{{p.sleeveR}}" fill="{{top}}"></path>
</g>
<path d="M50 206 L150 206 L152 236 Q100 242 48 236 Z" fill="{{top}}" display="{{d.topOut}}"></path>
<g display="{{d.beltUnder}}">
<rect x="52" y="204" width="96" height="11" fill="{{belt}}"></rect>
<rect x="95" y="205" width="10" height="9" fill="none"></rect>
</g>
<g display="{{d.knit}}">
<path d="{{p.knit}}" fill="{{knit}}"></path>
<path d="{{p.knitL}}" fill="{{knit}}"></path>
<path d="{{p.knitR}}" fill="{{knit}}"></path>
<path d="M89 86 L100 118 L111 86 Z" fill="{{vFill}}"></path>
</g>
<g display="{{d.beltOver}}">
<rect x="52" y="204" width="96" height="11" fill="{{belt}}"></rect>
<rect x="95" y="205" width="10" height="9" fill="none"></rect>
</g>
<path d="M86 80 L100 96 L114 80 L118 90 L100 104 L82 90 Z" fill="{{top}}" display="{{d.top}}"></path>
<path d="M94 82 L100 96 L106 82 Z" fill="{{skin}}" display="{{d.neckOpen}}"></path>
<path d="{{p.tie}}" fill="{{tie}}" display="{{d.tie}}"></path>
<g display="{{d.jacket}}">
<path d="M44 90 Q29 97 27 123 L21 204 L42 206 L50 146 Z" fill="{{jacket}}"></path>
<path d="M156 90 Q171 97 173 123 L179 204 L158 206 L150 146 Z" fill="{{jacket}}"></path>
<path d="M44 88 Q68 79 91 82 L100 128 L101 244 L50 244 L45 154 Q35 122 44 88 Z" fill="{{jacket}}"></path>
<path d="M156 88 Q132 79 109 82 L100 128 L100 244 L150 244 L155 154 Q165 122 156 88 Z" fill="{{jacket}}"></path>
<path d="M91 82 L84 112 L100 128 M109 82 L116 112 L100 128" fill="none"></path>
<circle cx="100" cy="168" r="2.4" fill="{{line}}"></circle>
<circle cx="100" cy="198" r="2.4" fill="{{line}}"></circle>
</g>
<g display="{{d.coat}}">
<path d="M40 88 Q24 95 22 122 L16 212 L42 214 L50 148 Z" fill="{{coat}}"></path>
<path d="M160 88 Q176 95 178 122 L184 212 L158 214 L150 148 Z" fill="{{coat}}"></path>
<path d="M40 86 Q66 76 90 80 L100 124 L101 334 L44 334 L38 160 Q28 120 40 86 Z" fill="{{coat}}"></path>
<path d="M160 86 Q134 76 110 80 L100 124 L100 334 L156 334 L162 160 Q172 120 160 86 Z" fill="{{coat}}"></path>
<path d="M90 80 L82 110 L100 124 M110 80 L118 110 L100 124" fill="none"></path>
<rect x="96" y="160" width="8" height="4" rx="2" fill="{{line}}"></rect>
<rect x="96" y="204" width="8" height="4" rx="2" fill="{{line}}"></rect>
<rect x="96" y="248" width="8" height="4" rx="2" fill="{{line}}"></rect>
</g>
<g display="{{d.scarf}}">
<path d="M80 72 Q100 88 120 72 L125 86 Q100 106 75 86 Z" fill="{{scarf}}"></path>
<path d="M104 94 L119 91 L122 168 L107 170 Z" fill="{{scarf}}"></path>
<path d="M109 170 L109 176 M114 169 L114 175 M119 168 L119 174" fill="none"></path>
</g>
<g display="{{d.glasses}}" fill="none">
<circle cx="93" cy="36" r="5.5"></circle>
<circle cx="107" cy="36" r="5.5"></circle>
<path d="M98.5 36 L101.5 36"></path>
</g>
<rect x="23" y="193" width="15" height="9" rx="2" fill="{{watch}}" display="{{d.watch}}"></rect>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":200},"h":{"editor":"int","default":460},"top":{"editor":"color","default":"#E9DFC7"},"knit":{"editor":"color","default":"#6E2230"},"jacket":{"editor":"color","default":"#6B4A33"},"coat":{"editor":"color","default":""},"pants":{"editor":"color","default":"#8A8780"},"shoes":{"editor":"color","default":"#6B4A33"},"scarf":{"editor":"color","default":"#2F4A3A"},"belt":{"editor":"color","default":"#6B4A33"},"tie":{"editor":"color","default":""},"watch":{"editor":"color","default":"#B5884F"},"glasses":{"editor":"color","default":"#6B4A33"},"socks":{"editor":"color","default":"#6E2230"},"skin":{"editor":"color","default":"#E2D6C1"},"line":{"editor":"color","default":"#2A211C"},"sw":{"editor":"float","default":1.3},"topOut":{"editor":"boolean","default":false},"knitIn":{"editor":"boolean","default":false},"rolled":{"editor":"boolean","default":false},"colOpen":{"editor":"boolean","default":true},"$preview":{"width":200,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = (k, dflt) => (p[k] === undefined || p[k] === null) ? dflt : p[k];
    const top = v('top', '#E9DFC7');
    const knit = v('knit', '#6E2230');
    const jacket = v('jacket', '#6B4A33');
    const coat = v('coat', '');
    const pants = v('pants', '#8A8780');
    const shoes = v('shoes', '#6B4A33');
    const scarf = v('scarf', '#2F4A3A');
    const belt = v('belt', '#6B4A33');
    const tie = v('tie', '');
    const watch = v('watch', '#B5884F');
    const glasses = v('glasses', '#6B4A33');
    const socks = v('socks', '#6E2230');
    const skin = v('skin', '#E2D6C1');
    const topOut = !!v('topOut', false);
    const knitIn = !!v('knitIn', false);
    const rolled = !!v('rolled', false);
    const colOpen = !!v('colOpen', true);
    const on = (x) => (x ? 'inline' : 'none');
    const parts = [];
    if (coat) parts.push('manteau');
    if (jacket) parts.push('veste');
    if (knit) parts.push('maille');
    if (top) parts.push('haut');
    if (pants) parts.push('pantalon');
    if (shoes) parts.push('chaussures');
    return {
      w: v('w', 200), h: v('h', 460),
      top, knit, jacket, coat, pants, shoes, scarf, belt, tie, watch, socks, skin,
      line: v('line', '#2A211C'), sw: v('sw', 1.3),
      vFill: top || skin,
      alt: 'Avatar portant : ' + (parts.join(', ') || 'aucune pièce'),
      d: {
        socks: on(socks), noSocks: on(!socks), pants: on(pants), shoes: on(shoes),
        top: on(top), topOut: on(top && topOut),
        beltUnder: on(belt && !knit && !(top && topOut)),
        beltOver: on(belt && knit && knitIn),
        knit: on(knit), neckOpen: on(top && colOpen && !tie), tie: on(tie),
        jacket: on(jacket), coat: on(coat), scarf: on(scarf), glasses: on(glasses), watch: on(watch)
      },
      p: {
        sleeveL: rolled ? 'M44 94 Q31 100 30 122 L27 168 L45 170 L50 142 Z' : 'M44 94 Q31 100 30 122 L23 206 L41 208 L50 142 Z',
        sleeveR: rolled ? 'M156 94 Q169 100 170 122 L173 168 L155 170 L150 142 Z' : 'M156 94 Q169 100 170 122 L177 206 L159 208 L150 142 Z',
        knit: knitIn ? 'M56 86 Q100 78 144 86 L158 96 Q163 124 154 154 L150 214 L50 214 L46 154 Q37 124 42 96 Z' : 'M56 86 Q100 78 144 86 L158 96 Q163 124 154 154 L151 232 Q100 238 49 232 L46 154 Q37 124 42 96 Z',
        knitL: rolled ? 'M42 96 Q30 102 29 124 L27 166 L45 168 L50 144 Z' : 'M42 96 Q30 102 29 124 L23 200 L41 202 L50 144 Z',
        knitR: rolled ? 'M158 96 Q170 102 171 124 L173 166 L155 168 L150 144 Z' : 'M158 96 Q170 102 171 124 L177 200 L159 202 L150 144 Z',
        tie: knit ? 'M97 94 L103 94 L105 102 L102 117 L98 117 L95 102 Z' : 'M97 94 L103 94 L106 104 L102 192 L100 197 L98 192 L94 104 Z'
      }
    };
  }
}
</script>
</body>
</html>

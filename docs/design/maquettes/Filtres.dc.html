<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cabine · Filtres</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E1F2B}a:hover{color:#4F141E}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EBDD; color: #2A211C; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column">

<header style="display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; align-items: center; padding: 12px 8px 0">
<a href="D-mobile.dc.html" aria-label="Fermer les filtres" style="width: 44px; height: 44px; border-radius: 22px; color: #2A211C; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Libre Caslon Text', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.28em; color: #6E1F2B; padding-left: 0.28em">FILTRES</span>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52; margin-top: 2px">{{activeLabel}}</span>
</div>
<button onClick="{{clear}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #6E1F2B; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; justify-self: end">Effacer</button>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 22px">

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Libre Caslon Text', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6E1F2B">Teintes</h2>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52">{{tintCount}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tints}}" as="t" hint-placeholder-count="14">
<button onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 74px; padding: 10px 2px 8px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.bg}}; color: #2A211C; font-family: 'Figtree', sans-serif; font-size: 11.5px; font-weight: 500">
<span style="position: relative; width: 30px; height: 30px; border-radius: 15px; border: 1px solid #6B5D52; background: {{t.hex}}">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -5px; top: -5px; width: 16px; height: 16px; border-radius: 8px; background: #6E1F2B; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</span>
{{t.name}}
</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Libre Caslon Text', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6E1F2B">Tags</h2>
<span style="font-family: 'Libre Caslon Text', serif; font-size: 12px; font-style: italic; color: #6B5D52">{{tagCount}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="g" hint-placeholder-count="12">
<button onClick="{{g.toggle}}" aria-pressed="{{g.on}}" style="height: 38px; padding: 0 14px; border: 1px solid {{g.border}}; border-radius: 19px; background: {{g.bg}}; color: {{g.fg}}; font-family: 'Figtree', sans-serif; font-size: 13.5px; font-weight: 500">{{g.label}}</button>
</sc-for>
</div>
</section>

<p style="margin: 0; font-size: 13px; color: #6B5D52; line-height: 1.5">Dans un même groupe, une pièce doit porter <em>au moins une</em> des valeurs choisies. Les tiroirs de la composition n'affichent alors que ces pièces.</p>
</div>

<div style="padding: 10px 16px 20px; border-top: 1px solid #DDD0BA">
<a href="D-mobile.dc.html" style="height: 52px; border-radius: 12px; background: #6E1F2B; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">{{applyLabel}}</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tints: ['Bordeaux'], tags: ['laine', 'automne'] };
  toggle(key, v) {
    const cur = this.state[key];
    this.setState({ [key]: cur.indexOf(v) >= 0 ? cur.filter((x) => x !== v) : cur.concat([v]) });
  }
  renderVals() {
    const T = [['Écru', '#E9DFC7'], ['Camel', '#B5884F'], ['Moutarde', '#C29A3A'], ['Terracotta', '#C0704F'], ['Rouille', '#A4532B'], ['Bordeaux', '#6E2230'], ['Marron', '#6B4A33'], ['Sauge', '#9AA58A'], ['Olive', '#6F6B3A'], ['Vert forêt', '#2F4A3A'], ['Bleu pétrole', '#2E5560'], ['Marine', '#26324A'], ['Gris flanelle', '#8A8780'], ['Anthracite', '#3A3A3C']];
    const G = ['laine', 'coton', 'velours', 'tweed', 'daim', 'automne', 'hiver', 'été', 'bureau', 'week-end', 'pluie', 'preppy'];
    const s = this.state;
    const n = s.tints.length + s.tags.length;
    return {
      tints: T.map((t) => { const on = s.tints.indexOf(t[0]) >= 0; return { name: t[0], hex: t[1], on: on, bg: on ? '#FBF6EC' : 'transparent', border: on ? '#6E1F2B' : '#DDD0BA', toggle: () => this.toggle('tints', t[0]) }; }),
      tags: G.map((g) => { const on = s.tags.indexOf(g) >= 0; return { label: g, on: on, bg: on ? '#2A211C' : 'transparent', fg: on ? '#FBF6EC' : '#2A211C', border: on ? '#2A211C' : '#CDBEA5', toggle: () => this.toggle('tags', g) }; }),
      tintCount: s.tints.length ? s.tints.length + ' choisie' + (s.tints.length > 1 ? 's' : '') : 'Toutes',
      tagCount: s.tags.length ? s.tags.length + ' choisi' + (s.tags.length > 1 ? 's' : '') : 'Tous',
      activeLabel: n ? n + ' filtre' + (n > 1 ? 's' : '') + ' actif' + (n > 1 ? 's' : '') : 'Aucun filtre',
      applyLabel: n ? 'Appliquer ' + n + ' filtre' + (n > 1 ? 's' : '') : 'Afficher toutes les pièces',
      clear: () => this.setState({ tints: [], tags: [] })
    };
  }
}
</script>
</body>
</html>
